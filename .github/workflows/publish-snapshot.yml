name: Build & Publish Snapshot

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Two quick pushes to master would otherwise race each other's uploads.
concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  build-and-deploy-snapshot:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Build SNAPSHOT jar
        run: mvn clean package -Pall -DskipTests=true

      - name: Deploy SNAPSHOT to GitHub Packages
        run: mvn deploy -Pall -DskipTests=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-javadoc:
    needs: build-and-deploy-snapshot
    uses: ./.github/workflows/publish-javadoc.yml