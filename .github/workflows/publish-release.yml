name: Build & Publish Release

on:
  release:
    types: [published]

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy-release:
    runs-on: ubuntu-latest

    permissions:
      # contents: write to upload the release asset; packages: write for the
      # GitHub Packages deploy. Naming any scope sets every other to none, so
      # both must be listed explicitly.
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Start solo
        run: make solo-up  

      - name: Set version from tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Using version $TAG_NAME"
          mvn versions:set -DnewVersion=$TAG_NAME

      - name: Build and deploy Release to GitHub Packages
        run: mvn clean deploy -Pall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Without this the release ships no downloadable artifact: v0.1.0 and v0.1.1
      # both published zero assets, so the runnable CLI jar was unobtainable
      # except by building from source.
      - name: Attach runnable jar to the release
        run: gh release upload "${GITHUB_REF#refs/tags/}" target/*-with-dependencies.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop solo
        run: make solo-down  

  publish-javadoc:
    needs: build-and-deploy-release
    uses: ./.github/workflows/publish-javadoc.yml
